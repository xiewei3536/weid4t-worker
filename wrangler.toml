# ─────────────────────────────────────────────────────────────
# 偉電視（WeiTV）控制平面 — Cloudflare Worker 設定檔
# ─────────────────────────────────────────────────────────────

# Worker 名稱（對齊 repo 名,避免 Workers Builds 名稱不符警告）
# 部署後網址：https://<name>.<你的子網域>.workers.dev
name = "weid4t-worker"

# 進入點
main = "src/index.js"

# Cloudflare 相容日期
compatibility_date = "2025-06-01"

# ── KV namespace 綁定 ────────────────────────────────────────
# 程式中以 env.CONFIG_KV 存取。
# 「故意不寫 id」：一鍵部署 / wrangler v4 會自動建立此 namespace 並回填 id,
# 完全免手動。(手動 CLI 部署時,wrangler v4 同樣會自動建立)
[[kv_namespaces]]
binding = "CONFIG_KV"

# ── 環境變數 ─────────────────────────────────────────────────
# ADMIN_PASSWORD 不寫在這裡。一鍵部署會依 .dev.vars.example 提示你輸入;
# 手動部署用：wrangler secret put ADMIN_PASSWORD
